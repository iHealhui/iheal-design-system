<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>iHealtw Design System</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-blue: #00C3DB;
            --text-dark: #1e293b;
            --bg-light: #f8fafc;
        }

        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; color: var(--text-dark); overflow: hidden; }

        /* 左側側邊欄 */
        aside {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .brand { padding: 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .brand h2 { margin: 0; font-size: 1.1rem; color: var(--primary-blue); }
        .brand small { color: #64748b; }

        .search-box { padding: 15px; position: sticky; top: 0; background: white; }
        .search-box input { 
            width: 100%; padding: 8px 12px; border-radius: 6px; 
            border: 1px solid #e2e8f0; font-size: 14px; box-sizing: border-box;
        }

        /* 導航選單 */
        nav { padding: 10px 0; flex: 1; }
        .nav-group { margin-bottom: 10px; }
        .group-title { padding: 8px 20px; font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        
        .nav-item { 
            padding: 8px 25px; cursor: pointer; font-size: 14px; transition: 0.2s; 
            display: flex; align-items: center; color: #475569;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--primary-blue); }
        .nav-item.sub { padding-left: 40px; font-size: 13px; }
        .nav-item.active { background: #e0f2fe; color: var(--primary-blue); font-weight: 600; border-right: 3px solid var(--primary-blue); }

        /* 右側內容區 */
        main { flex: 1; overflow-y: auto; background: var(--bg-light); padding: 40px; }
        .page-content { max-width: 900px; margin: 0 auto; }

        /* Token 展示樣式 */
        .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .swatch { background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; font-size: 11px; }
        .color-box { height: 60px; }
        .swatch-info { padding: 8px; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="brand" onclick="window.open('https://github.com/你的帳號/ihealtw-design-system')">
        <h2>@iheal-design-system</h2>
        <small>v1.0.0 (Taiwan)</small>
    </div>

    <div class="search-box">
        <input type="text" id="componentSearch" placeholder="Find Components...">
    </div>

    <nav id="menu">
        <div class="nav-item" data-target="welcome">🏠 Welcome</div>

        <div class="nav-group">
            <div class="group-title">Foundations</div>
            <div class="nav-item" data-target="tokens">Tokens</div>
            <div class="nav-item" data-target="accessibility">Accessibility</div>
            <div class="nav-item" data-target="color-roles">↪ Color roles</div>
            <div class="nav-item" data-target="color-palette">↪ Color Palette</div>
            <div class="nav-item" data-target="typography">Typography</div>
            <div class="nav-item" data-target="spacing">Spacing</div>
        </div>

        <div class="nav-group">
            <div class="group-title">Components</div>
            <div class="nav-item" data-target="btn">General: Button</div>
            <div class="nav-item" data-target="input">Input: Text Input</div>
            <div class="nav-item" data-target="checkbox">Input: Checkbox</div>
            <div class="nav-item" data-target="radio">Input: Radio</div>
            </div>
    </nav>
</aside>

<main>
    <div class="page-content" id="content-view">
        <h1>Welcome</h1>
        <p>請從左側選擇分類開始。這是一個由 JSON Token 驅動的設計系統。</p>
    </div>
</main>

<script>
    // 萬能 Token 解析器 (延續之前的邏輯)
    function resolveToken(val, fullData) {
        if (typeof val === 'string' && val.startsWith('{')) {
            const path = val.replace(/[{}]/g, '').split('.');
            let current = fullData;
            for (const part of path) {
                if (current && current[part]) { current = current[part]; }
                else { return '#cbd5e1'; }
            }
            return resolveToken(current.$value, fullData);
        }
        return (val && typeof val === 'object' && val.hex) ? val.hex : val;
    }

    // 點擊事件處理
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function() {
            const target = this.getAttribute('data-target');
            renderPage(target);
            
            // 更新 Active 樣式
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });

    async function renderPage(pageId) {
        const view = document.getElementById('content-view');
        const res = await fetch('./data/tokens.json');
        const data = await res.json();
        const root = data.ihealtw;

        if (pageId === 'color-palette') {
            let html = "<h1>Color Palette (Ref)</h1>";
            for (const [groupName, colors] of Object.entries(root.Ref.Color)) {
                html += `<h3>${groupName}</h3><div class="token-grid">`;
                for (const [shade, token] of Object.entries(colors)) {
                    const hex = resolveToken(token.$value, data);
                    html += `
                        <div class="swatch">
                            <div class="color-box" style="background: ${hex}"></div>
                            <div class="swatch-info"><strong>${shade}</strong><br><code>${hex}</code></div>
                        </div>`;
                }
                html += `</div>`;
            }
            view.innerHTML = html;
        } else if (pageId === 'color-roles') {
            view.innerHTML = "<h1>Color Roles (Sys)</h1><p>展示語意化 Token（如 Sys.Color.Bg.Primary）...</p>";
        } else if (pageId === 'tokens') {
            view.innerHTML = "<h1>Token Naming Convention</h1><p>在這裡解釋您的 ihealtw.ref.xxx 命名規則。</p>";
        } else {
            view.innerHTML = `<h1>${pageId}</h1><p>該頁面內容正在建設中...</p>`;
        }
    }

    // 簡單的搜尋過濾功能
    document.getElementById('componentSearch').addEventListener('input', function(e) {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.nav-item').forEach(item => {
            const text = item.innerText.toLowerCase();
            item.style.display = text.includes(val) ? 'flex' : 'none';
        });
    });
</script>

</body>
</html>
